<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add and Subtract Integers</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      padding: 0 1.5rem;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-badge {
      position: absolute;
      top: -2.5rem;
      left: 1.5rem;
      background-color: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.95rem;
      z-index: 5;
    }

    .reset-btn {
      position: absolute;
      top: -2.5rem;
      right: 1.5rem;
      background-color: #e2e8f0;
      color: #334155;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
      z-index: 5;
    }

    .reset-btn:hover {
      background-color: #cbd5e1;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 0.25rem;
      color: #0f172a;
      font-size: 1.6rem;
      text-align: center;
    }

    p.subtitle {
      color: #64748b;
      margin-top: 0;
      margin-bottom: 1rem;
      text-align: center;
      font-size: 0.95rem;
    }

    .card {
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
      background: #ffffff;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .problem-display {
      font-size: 2.2rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 1rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      max-width: 400px;
      margin: 0 auto;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.6rem 1rem;
      font-size: 1.15rem;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      background-color: #ffffff;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    button.action-btn {
      padding: 0.6rem 1.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.action-btn:hover {
      background-color: #1d4ed8;
    }

    .submit-panel {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
      display: none;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
    }

    .submit-panel input {
      width: 100%;
      max-width: 400px;
    }

    .submit-homework-btn {
      background-color: #059669;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      max-width: 400px;
      transition: background-color 0.2s;
    }

    .submit-homework-btn:hover {
      background-color: #047857;
    }

    .ledgerfield-card {
      width: 100vw;
      height: 200px;
      padding: 0.75rem 0;
      display: block;
      visibility: hidden;
      position: relative;
      background: #e2e8f0;
      border-top: 2px solid #cbd5e1;
      border-bottom: 2px solid #cbd5e1;
      margin-top: 1.25rem;
    }

    .ledgerfield-layout {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding-left: calc((100vw - 900px) / 2 + 1.5rem);
      padding-right: 1.5rem;
    }

    .ledger-top-row {
      display: flex;
      align-items: center;
      width: 100%;
    }

    @media (max-width: 900px) {
      .ledgerfield-layout {
        padding-left: 1.5rem;
      }
    }

    .labels-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 110px;
      min-width: 160px;
      padding-right: 1rem;
    }

    .label {
      font-weight: 800;
      font-size: 0.95rem;
      color: #334155;
      height: 40px;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }

    .grid-track {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      flex: 1;
      padding-bottom: 6px;
      padding-right: 2rem;
      position: relative;
    }

    .token-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 110px;
      width: 34px;
      flex-shrink: 0;
    }

    .token-slot {
      width: 34px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .token {
      width: 34px;
      height: 40px;
      transition: transform 0.8s ease-in-out, opacity 0.4s ease-out;
      position: relative;
      z-index: 10;
    }

    .token svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.2));
    }

    .disappearing {
      opacity: 0 !important;
      visibility: hidden;
      transition: opacity 0.4s ease-out, visibility 0.4s;
    }

    .group-outline {
      position: absolute;
      border: 3px dashed #2563eb;
      border-radius: 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease-in-out, width 0.5s ease-in-out, left 0.5s ease-in-out;
      background-color: rgba(37, 99, 235, 0.05);
      z-index: 5;
    }

    .group-outline.visible {
      opacity: 1;
    }

    .feedback-box {
      margin-top: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      display: none;
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      max-width: 600px;
      line-height: 1.3;
      text-align: center;
      align-self: center;
    }

    .feedback-box.incorrect {
      background-color: #ffeeec;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="scoreBadge" class="score-badge">Score: 0 / 20</div>
  <button class="reset-btn" onclick="resetPractice()">Restart</button>

  <h1>Add & Subtract Integers</h1>
  <p id="instructionSubtitle" class="subtitle">Solve 20 problems on the first try to complete your practice assignment! Press enter to advance.</p>

  <div class="card">
    <div id="problemDisplay" class="problem-display"></div>
    <div id="practiceControlGroup" class="input-group">
      <input type="text" id="answerInput" placeholder="Your answer" autofocus />
      <button class="action-btn" id="submitBtn" onclick="handleAction()">Submit</button>
    </div>

    <div id="submitPanel" class="submit-panel">
      <p style="color: #059669; font-weight: 700; margin: 0;">🎉 Drill Complete! Enter your name to submit:</p>
      <input type="text" id="studentNameInput" placeholder="Your Full Name" />
      <button class="submit-homework-btn" onclick="submitScoreToTeacher()">YOU NEED TO PRESS THE SUBMIT BUTTON TWICE. ONCE HERE AND ONCE ON THE GOOGLE FORM. ➔</button>
    </div>
  </div>
</div>

<div id="ledgerfield" class="ledgerfield-card">
  <div class="ledgerfield-layout">
    <div class="ledger-top-row">
      <div class="labels-column">
        <div id="labelPos" class="label">Credits (+0)</div>
        <div id="labelNeg" class="label">Debits (-0)</div>
      </div>
      
      <div id="gridTrack" class="grid-track" style="position: relative;">
        <div id="groupOutline1" class="group-outline"></div>
        <div id="groupOutline2" class="group-outline"></div>
      </div>
    </div>
    <div id="feedbackBox" class="feedback-box"></div>
  </div>
</div>

<script>
  // ==========================================
  // TEACHER CONFIGURATION
  // ==========================================
  const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSe4_Gnrq1zyrttA3lSgrVBtMkaVaoMim31ByzoH-orxmfDB2A/viewform";
  const ENTRY_NAME_ID = "entry.1899284808"; 
  const ENTRY_SCORE_ID = "entry.1974610095"; 
  const TARGET_SCORE = 20;                 
  // ==========================================

  const DEBIT_TOKEN_SVG = `
    <svg viewBox="0 0 64 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="12" y="14" width="40" height="52" rx="8" fill="#ef4444"/>
      <circle cx="32" cy="40" r="14" fill="#ffffff"/>
      <path d="M 24 40 L 40 40" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    </svg>
  `;

  const CREDIT_TOKEN_SVG = `
    <svg viewBox="0 0 64 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="12" y="14" width="40" height="52" rx="8" fill="#0f172a"/>
      <circle cx="32" cy="40" r="14" fill="#ffffff"/>
      <path d="M 24 40 L 40 40 M 32 32 L 32 48" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
    </svg>
  `;

  let currentProblem = null;
  let animationInterval = null;
  let isAnswerChecked = false;
  let firstTryCorrectCount = 0;
  let hasAnsweredCurrent = false;
  let waitingForEnter = false;
  let isCompleted = false;

  const scoreBadgeEl = document.getElementById('scoreBadge');
  const problemDisplayEl = document.getElementById('problemDisplay');
  const answerInputEl = document.getElementById('answerInput');
  const feedbackBoxEl = document.getElementById('feedbackBox');
  const submitBtnEl = document.getElementById('submitBtn');
  const ledgerfieldEl = document.getElementById('ledgerfield');
  const gridTrackEl = document.getElementById('gridTrack');
  const groupOutline1 = document.getElementById('groupOutline1');
  const groupOutline2 = document.getElementById('groupOutline2');
  const submitPanelEl = document.getElementById('submitPanel');
  const practiceControlGroupEl = document.getElementById('practiceControlGroup');
  const instructionSubtitleEl = document.getElementById('instructionSubtitle');
  const studentNameInputEl = document.getElementById('studentNameInput');

  window.onload = function() {
    loadNewProblem();
  };

  answerInputEl.addEventListener('input', function() {
    if (isAnswerChecked || isCompleted) return;
    const rawVal = answerInputEl.value.trim();
    if (rawVal === '' || rawVal === '-' || rawVal === '+') return;

    const userVal = parseInt(rawVal, 10);
    if (!isNaN(userVal) && userVal === currentProblem.ans) {
      checkAnswer();
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (document.activeElement === studentNameInputEl) {
        submitScoreToTeacher();
        return;
      }
      if (isCompleted) return;
      e.preventDefault();
      handleAction();
    }
  });

  function updateScoreDisplay() {
    scoreBadgeEl.textContent = `Score: ${firstTryCorrectCount} / ${TARGET_SCORE}`;
  }

  function handleAction() {
    if (isCompleted) return;
    if (!isAnswerChecked) {
      checkAnswer();
    } else if (waitingForEnter) {
      nextProblem();
    }
  }

  function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateRandomProblem() {
    let a = 0, b = 0;
    let opType = 0;
    let category = getRandomInt(1, 4); 

    while (true) {
      if (category === 1) {
        opType = 1;
        a = getRandomInt(-9, 9);
        b = getRandomInt(-9, -1);
        while (a === 0) a = getRandomInt(-9, 9);
        break;
      } else if (category === 2) {
        opType = getRandomInt(0, 1);
        if (opType === 0) {
          a = getRandomInt(-9, -1);
          b = getRandomInt(-9, -1);
        } else {
          a = getRandomInt(-9, -1);
          b = getRandomInt(1, 9);
        }
        break;
      } else if (category === 3) {
        opType = getRandomInt(0, 1);
        a = getRandomInt(-9, 9);
        b = getRandomInt(-9, 9);
        while (a === 0) a = getRandomInt(-9, 9);
        while (b === 0) b = getRandomInt(-9, 9);
        
        let isEasy = (a > 0 && b > 0 && Math.abs(a) + Math.abs(b) <= 10);
        let isSameNeg = (a < 0 && (opType === 0 ? b < 0 : b > 0));
        let isDoubleNeg = (opType === 1 && b < 0);
        
        if (!isEasy && !isSameNeg && !isDoubleNeg) {
          break;
        }
      } else {
        opType = 0;
        a = getRandomInt(1, 6);
        b = getRandomInt(1, 6);
        if (Math.random() < 0.15) {
          break;
        }
        category = getRandomInt(1, 3);
      }
    }

    let expr = "";
    let ans = 0;
    let pos = 0;
    let neg = 0;
    let type = "cancel";
    let g1 = 0, g2 = 0;
    
    let isDoubleNeg = (opType === 1 && b < 0);
    let isSameSign = false;

    if (opType === 0) {
      expr = `${a} + ${b < 0 ? '(' + b + ')' : b}`;
      ans = a + b;

      if (b < 0) {
        isSameSign = (a < 0);
      } else {
        isSameSign = ((a > 0 && b > 0) || (a < 0 && b < 0));
      }

      if (a < 0 && b < 0) {
        type = "same-sign-neg";
        neg = Math.abs(a) + Math.abs(b);
        g1 = Math.abs(a);
        g2 = Math.abs(b);
      } else if (a > 0 && b > 0) {
        type = "same-sign-pos";
        pos = a + b;
        g1 = a;
        g2 = b;
      } else {
        type = "cancel";
        pos = (a > 0 ? a : 0) + (b > 0 ? b : 0);
        neg = (a < 0 ? Math.abs(a) : 0) + (b < 0 ? Math.abs(b) : 0);
      }
    } else {
      let bOpp = -b;
      expr = `${a} - ${b < 0 ? '(' + b + ')' : b}`;
      ans = a - b;

      if (a < 0 && b > 0) {
        type = "same-sign-neg";
        neg = Math.abs(a) + Math.abs(b);
        g1 = Math.abs(a);
        g2 = Math.abs(b);
        isSameSign = true;
      } else if (a > 0 && b < 0) {
        type = "same-sign-pos";
        pos = a + Math.abs(b);
        g1 = a;
        g2 = Math.abs(b);
        isSameSign = true;
      } else if (isDoubleNeg) {
        isSameSign = false;
        type = "cancel";
        pos = (a > 0 ? a : 0) + (bOpp > 0 ? bOpp : 0);
        neg = (a < 0 ? Math.abs(a) : 0) + (bOpp < 0 ? Math.abs(bOpp) : 0);
      } else {
        if (a < 0 && b > 0) {
          type = "same-sign-neg";
          neg = Math.abs(a) + Math.abs(b);
          g1 = Math.abs(a);
          g2 = Math.abs(b);
          isSameSign = true;
        } else {
          type = "cancel";
          pos = (a > 0 ? a : 0) + (bOpp > 0 ? bOpp : 0);
          neg = (a < 0 ? Math.abs(a) : 0) + (bOpp < 0 ? Math.abs(bOpp) : 0);
        }
      }
    }

    return { expr, ans, pos, neg, type, group1: g1, group2: g2, isDoubleNeg, isSameSign, a, b };
  }

  function loadNewProblem() {
    if (isCompleted) return;

    if (animationInterval) {
      clearInterval(animationInterval);
      animationInterval = null;
    }

    isAnswerChecked = false;
    hasAnsweredCurrent = false;
    waitingForEnter = false;
    groupOutline1.classList.remove('visible');
    groupOutline2.classList.remove('visible');

    currentProblem = generateRandomProblem();
    problemDisplayEl.textContent = currentProblem.expr;
    answerInputEl.value = '';
    answerInputEl.disabled = false;
    submitBtnEl.textContent = 'Submit';
    feedbackBoxEl.style.display = 'none';
    ledgerfieldEl.style.visibility = 'hidden';
    answerInputEl.focus();
  }

  function getAccurateFeedback(prob) {
    if (prob.isDoubleNeg) {
      return " - - makes +";
    } else if (prob.isSameSign) {
      let absA = Math.abs(prob.a);
      let secondNum = (prob.expr.includes(' - ') && !prob.isDoubleNeg) ? -prob.b : prob.b;
      let absB = Math.abs(secondNum);
      
      let isNegResult = (prob.ans < 0);
      let signText = isNegResult ? "Keep negative sign" : "Keep positive sign";
      return `Add absolute values (${absA} + ${absB}). ${signText}`;
    } else {
      let effectiveNum1 = prob.a;
      let effectiveNum2 = prob.b;
      if (prob.expr.includes(' - ') && !prob.isDoubleNeg) {
        effectiveNum2 = -prob.b;
      }
      
      let abs1 = Math.abs(effectiveNum1);
      let abs2 = Math.abs(effectiveNum2);
      
      if (prob.ans === 0) {
        return `Subtract absolute values (${Math.max(abs1, abs2)} - ${Math.min(abs1, abs2)}). The answer is 0, which is neither positive nor negative.`;
      }
      
      let largerNum = abs1 >= abs2 ? effectiveNum1 : effectiveNum2;
      let signText = largerNum < 0 ? "Keep bigger absolute value sign (negative)" : "Keep bigger absolute value sign (positive)";
      
      return `Subtract absolute values (${Math.max(abs1, abs2)} - ${Math.min(abs1, abs2)}). ${signText}`;
    }
  }

  function checkAnswer() {
    if (isCompleted) return;
    const rawVal = answerInputEl.value.trim();
    if (rawVal === '') return;

    const userVal = parseInt(rawVal, 10);

    if (isNaN(userVal)) {
      feedbackBoxEl.textContent = 'Please enter a valid integer.';
      feedbackBoxEl.className = 'feedback-box incorrect';
      feedbackBoxEl.style.display = 'block';
      return;
    }

    isAnswerChecked = true;
    answerInputEl.disabled = true;

    if (userVal === currentProblem.ans) {
      if (!hasAnsweredCurrent) {
        firstTryCorrectCount++;
        updateScoreDisplay();
      }

      if (firstTryCorrectCount >= TARGET_SCORE) {
        triggerCompletion();
        return;
      }

      submitBtnEl.textContent = 'Next ➔';
      feedbackBoxEl.style.display = 'none';
      
      startLedgerModel(currentProblem);
    } else {
      hasAnsweredCurrent = true;
      submitBtnEl.textContent = 'Next ➔';
      const tipText = getAccurateFeedback(currentProblem);
      feedbackBoxEl.textContent = tipText;
      feedbackBoxEl.className = 'feedback-box incorrect';
      feedbackBoxEl.style.display = 'block';
      
      startLedgerModel(currentProblem);
    }
  }

  function triggerCompletion() {
    isCompleted = true;
    if (animationInterval) {
      clearInterval(animationInterval);
      animationInterval = null;
    }
    problemDisplayEl.textContent = "🏆 Drill Completed!";
    instructionSubtitleEl.textContent = "You reached 20 correct answers on the first try!";
    practiceControlGroupEl.style.display = 'none';
    feedbackBoxEl.style.display = 'none';
    ledgerfieldEl.style.visibility = 'hidden';
    
    submitPanelEl.style.display = 'flex';
    studentNameInputEl.focus();
  }

  function startLedgerModel(current) {
    if (isCompleted) return;
    ledgerfieldEl.style.visibility = 'visible';
    
    if (current.type === 'same-sign-neg') {
      renderSameSignLedgerfield(current.neg, current.group1, current.group2, 'neg');
      runSameSignAnimation(current.group1, current.group2, 'negative');

      animationInterval = setInterval(() => {
        if (isCompleted) return;
        renderSameSignLedgerfield(current.neg, current.group1, current.group2, 'neg');
        runSameSignAnimation(current.group1, current.group2, 'negative');
      }, 4000);
    } else if (current.type === 'same-sign-pos') {
      renderSameSignLedgerfield(current.pos, current.group1, current.group2, 'pos');
      runSameSignAnimation(current.group1, current.group2, 'positive');

      animationInterval = setInterval(() => {
        if (isCompleted) return;
        renderSameSignLedgerfield(current.pos, current.group1, current.group2, 'pos');
        runSameSignAnimation(current.group1, current.group2, 'positive');
      }, 4000);
    } else {
      runSingleLedgerCycle(current.pos, current.neg);

      animationInterval = setInterval(() => {
        if (isCompleted) return;
        runSingleLedgerCycle(current.pos, current.neg);
      }, 3200);
    }
  }

  function renderSameSignLedgerfield(totalCount, g1Size, g2Size, signType) {
    const labelPos = document.getElementById('labelPos');
    const labelNeg = document.getElementById('labelNeg');

    if (signType === 'neg') {
      labelPos.textContent = `Credits (+0)`;
      labelNeg.textContent = `Debits (-${totalCount})`;
    } else {
      labelPos.textContent = `Credits (+${totalCount})`;
      labelNeg.textContent = `Debits (-0)`;
    }

    gridTrackEl.innerHTML = '';
    gridTrackEl.appendChild(groupOutline1);
    gridTrackEl.appendChild(groupOutline2);

    groupOutline1.classList.remove('visible');
    groupOutline2.classList.remove('visible');

    for (let i = 0; i < totalCount; i++) {
      const colDiv = document.createElement('div');
      colDiv.className = 'token-column';

      const topSlot = document.createElement('div');
      topSlot.className = 'token-slot';
      const bottomSlot = document.createElement('div');
      bottomSlot.className = 'token-slot';

      const token = document.createElement('div');
      token.className = 'token';
      
      if (signType === 'neg') {
        token.id = `neg-token-${i}`;
        token.innerHTML = DEBIT_TOKEN_SVG;
        bottomSlot.appendChild(token);
      } else {
        token.id = `pos-token-${i}`;
        token.innerHTML = CREDIT_TOKEN_SVG;
        topSlot.appendChild(token);
      }

      colDiv.appendChild(topSlot);
      colDiv.appendChild(bottomSlot);
      gridTrackEl.appendChild(colDiv);
    }
  }

  function runSameSignAnimation(g1Size, g2Size, signWord) {
    const colWidth = 34;
    const gap = 6;
    const leftPadding = 0;

    const w1 = (g1Size * colWidth) + ((g1Size - 1) * gap) + 6;
    const h1 = 44;
    const topPos = signWord === 'negative' ? `62px` : `-2px`;

    groupOutline1.style.width = `${w1}px`;
    groupOutline1.style.height = `${h1}px`;
    groupOutline1.style.left = `${leftPadding - 3}px`;
    groupOutline1.style.top = topPos;

    const left2 = (g1Size * (colWidth + gap)) - 3;
    const w2 = (g2Size * colWidth) + ((g2Size - 1) * gap) + 6;

    groupOutline2.style.width = `${w2}px`;
    groupOutline2.style.height = `${h1}px`;
    groupOutline2.style.left = `${left2}px`;
    groupOutline2.style.top = topPos;

    setTimeout(() => {
      if (!isCompleted) groupOutline1.classList.add('visible');
    }, 400);

    setTimeout(() => {
      if (!isCompleted) groupOutline2.classList.add('visible');
    }, 900);

    setTimeout(() => {
      if (!isCompleted) {
        waitingForEnter = true;
        answerInputEl.focus();
      }
    }, 1500);
  }

  function runSingleLedgerCycle(posCount, negCount) {
    if (isCompleted) return;
    renderLedgerfieldGrid(posCount, negCount);

    if (posCount > 0 && negCount > 0) {
      const cancelCount = Math.min(posCount, negCount);
      const posRowMoveY = 34; 
      const negRowMoveY = -34; 

      setTimeout(() => {
        if (isCompleted) return;
        for (let i = 0; i < cancelCount; i++) {
          const posToken = document.getElementById(`pos-token-${i}`);
          const negToken = document.getElementById(`neg-token-${i}`);

          if (posToken && negToken) {
            posToken.style.transform = `translateY(${posRowMoveY}px)`;
            negToken.style.transform = `translateY(${negRowMoveY}px)`;
          }
        }
      }, 200);

      setTimeout(() => {
        if (isCompleted) return;
        for (let i = 0; i < cancelCount; i++) {
          const posToken = document.getElementById(`pos-token-${i}`);
          const negToken = document.getElementById(`neg-token-${i}`);

          if (posToken && negToken) {
            posToken.classList.add('disappearing');
            negToken.classList.add('disappearing');
          }
        }
      }, 1050);
    }

    setTimeout(() => {
      if (!isCompleted) {
        waitingForEnter = true;
        answerInputEl.focus();
      }
    }, 1500);
  }

  function renderLedgerfieldGrid(posCount, negCount) {
    const labelPos = document.getElementById('labelPos');
    const labelNeg = document.getElementById('labelNeg');

    labelPos.textContent = `Credits (+${posCount})`;
    labelNeg.textContent = `Debits (-${negCount})`;

    gridTrackEl.innerHTML = '';
    gridTrackEl.appendChild(groupOutline1);
    gridTrackEl.appendChild(groupOutline2);
    groupOutline1.classList.remove('visible');
    groupOutline2.classList.remove('visible');

    const maxColumns = Math.max(posCount, negCount);

    for (let i = 0; i < maxColumns; i++) {
      const colDiv = document.createElement('div');
      colDiv.className = 'token-column';

      const topSlot = document.createElement('div');
      topSlot.className = 'token-slot';
      if (i < posCount) {
        const token = document.createElement('div');
        token.className = 'token';
        token.id = `pos-token-${i}`;
        token.innerHTML = CREDIT_TOKEN_SVG;
        topSlot.appendChild(token);
      }

      const bottomSlot = document.createElement('div');
      bottomSlot.className = 'token-slot';
      if (i < negCount) {
        const token = document.createElement('div');
        token.className = 'token';
        token.id = `neg-token-${i}`;
        token.innerHTML = DEBIT_TOKEN_SVG;
        bottomSlot.appendChild(token);
      }

      colDiv.appendChild(topSlot);
      colDiv.appendChild(bottomSlot);
      gridTrackEl.appendChild(colDiv);
    }
  }

  function nextProblem() {
    loadNewProblem();
  }

  function resetPractice() {
    isCompleted = false;
    firstTryCorrectCount = 0;
    updateScoreDisplay();
    instructionSubtitleEl.textContent = "Solve 20 problems on the first try to complete your practice assignment! Press enter to advance.";
    practiceControlGroupEl.style.display = 'flex';
    submitPanelEl.style.display = 'none';
    loadNewProblem();
  }

  function submitScoreToTeacher() {
    const studentName = studentNameInputEl.value.trim();
    if (!studentName) {
      alert("Please enter your name before submitting your score!");
      studentNameInputEl.focus();
      return;
    }

    const formUrl = `${GOOGLE_FORM_URL}?${ENTRY_NAME_ID}=${encodeURIComponent(studentName)}&${ENTRY_SCORE_ID}=${encodeURIComponent(firstTryCorrectCount)}`;
    window.open(formUrl, '_blank');
  }
</script>
